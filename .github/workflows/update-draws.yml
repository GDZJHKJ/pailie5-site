name: Update P5 Draws

on:
  schedule:
    # 每天 UTC 13:25 = 北京时间 21:25 开始轮询
    - cron: "25 13 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "手动运行时的轮询次数（1 = 只抓一次，用于连通性测试）"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll for latest draws (21:25-22:00 Beijing, every 60s)
        env:
          # 可选中继（直连失败时兜底）；体彩 API 在腾讯 EdgeOne CDN 上，海外通常可达
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 定时任务轮询 36 轮（覆盖 21:25-22:00）；手动触发默认只跑 1 轮便于快速验证连通性
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ROUNDS=36
          else
            ROUNDS="${{ github.event.inputs.rounds }}"
            ROUNDS=${ROUNDS:-1}
          fi
          echo "本次轮询次数：$ROUNDS（触发方式：${{ github.event_name }}）"

          for i in $(seq 1 $ROUNDS); do
            NOW=$(date -u '+%H:%M UTC')
            echo "=== 轮询 #$i/$ROUNDS ($NOW) ==="

            python scripts/fetch_data.py --check
            CHECK_CODE=$?

            if [ $CHECK_CODE -eq 2 ]; then
              echo ">>> 检测到新数据，全量拉取 500 期..."
              if python scripts/fetch_data.py; then
                git add data/draws.json
                if git diff --cached --quiet; then
                  echo ">>> 文件内容未变，继续等待"
                else
                  git commit -m "chore(data): update 排列5 draws (auto) $(date -u +%Y-%m-%d_%H:%M)"
                  git push
                  echo ">>> 更新完成！"
                  exit 0
                fi
              else
                echo ">>> 全量拉取失败，继续等待"
              fi
            elif [ $CHECK_CODE -eq 0 ]; then
              echo ">>> 暂无新数据"
            else
              echo ">>> 检查异常 (code=$CHECK_CODE)，跳过本轮"
            fi

            if [ $i -lt $ROUNDS ]; then
              sleep 60
            fi
          done

          echo "=== 本次轮询结束 ==="
