name: Update P5 Draws

on:
  schedule:
    # 每天 UTC 13:25 = 北京时间 21:25 开始轮询
    - cron: "25 13 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "手动运行时的轮询次数（1 = 只抓一次，用于连通性测试）"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll for latest draws (21:25-22:00 Beijing, every 60s)
        env:
          # 可选中继（直连失败时兜底）；体彩 API 在腾讯 EdgeOne CDN 上，海外通常可达
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 定时任务轮询 36 轮（覆盖 21:25-22:00）；手动触发默认只跑 1 轮便于快速验证
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ROUNDS=36
          else
            ROUNDS="${{ github.event.inputs.rounds }}"
            ROUNDS=${ROUNDS:-1}
          fi
          echo "本次轮询次数：$ROUNDS（触发方式：${{ github.event_name }}）"

          commit_if_changed () {
            git add data/draws.json
            if git diff --cached --quiet; then
              echo ">>> 文件内容未变"
              return 1
            fi
            git commit -m "chore(data): update 排列5 draws (auto, $1) $(date -u +%Y-%m-%d_%H:%M)"
            git push
            echo ">>> 已推送更新（数据源：$1）"
            return 0
          }

          for i in $(seq 1 $ROUNDS); do
            echo "=== 轮询 #$i/$ROUNDS ($(date -u '+%H:%M UTC')) ==="

            # 1) 优先官方接口
            python scripts/fetch_data.py --check
            OFFICIAL=$?

            if [ $OFFICIAL -eq 2 ]; then
              echo ">>> 官方接口有新数据，全量拉取 500 期..."
              if python scripts/fetch_data.py; then
                commit_if_changed "official" && exit 0
              else
                echo ">>> 官方全量拉取失败，本轮降级到镜像源"
                OFFICIAL=1
              fi
            fi

            # 2) 官方不可达（境外 IP 常见 567 拦截）或有新数据但拉取失败 -> 镜像源
            if [ $OFFICIAL -ne 0 ]; then
              echo ">>> 官方接口不可用 (code=$OFFICIAL)，改用 500.com 镜像（写入前做重叠期逐条校验）"
              python scripts/fetch_mirror.py --check
              MIRROR=$?
              if [ $MIRROR -eq 2 ]; then
                if python scripts/fetch_mirror.py; then
                  commit_if_changed "mirror" && exit 0
                else
                  echo ">>> 镜像全量拉取/校验失败，保留旧数据，继续等待"
                fi
              elif [ $MIRROR -eq 0 ]; then
                echo ">>> 镜像确认：暂无新数据"
              else
                echo ">>> 镜像异常 (code=$MIRROR)"
              fi
            elif [ $OFFICIAL -eq 0 ]; then
              echo ">>> 官方确认：暂无新数据"
            fi

            if [ $i -lt $ROUNDS ]; then
              sleep 60
            fi
          done

          echo "=== 本次轮询结束 ==="
