name: Update P5 Draws

on:
  schedule:
    # 每天 UTC 13:25 = 北京时间 21:25 开始轮询
    # 排列5 通常 21:30 左右开奖，21:25 开始每分钟检查一次
    - cron: "25 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-p5-draws
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug Worker response
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          echo "PROXY_URL set: $([ -n "$PROXY_URL" ] && echo YES || echo NO)"
          if [ -n "$PROXY_URL" ]; then
            echo "Worker URL: $PROXY_URL"
            echo "--- Health check ---"
            curl -s -m 15 "$PROXY_URL/health" || echo "(health check failed)"
            echo ""
            echo "--- API test (pageSize=1) ---"
            curl -s -m 20 "$PROXY_URL/?gameNo=350133&provinceId=0&pageSize=1&isVerify=1&pageNo=1" | head -c 1000
            echo ""
            echo "--- HTTP status ---"
            curl -s -o /dev/null -w "%{http_code}" -m 20 "$PROXY_URL/?gameNo=350133&provinceId=0&pageSize=1&isVerify=1&pageNo=1"
            echo ""
          fi

      - name: Poll for latest draws (21:25-22:00 Beijing, every 60s)
        env:
          # Cloudflare Worker 中继 URL（体彩接口会拦截 GitHub Actions 的 Azure IP，返回 HTTP 567）
          # 部署方法见 README.md → Cloudflare Worker 部署
          # 未设置时直连体彩接口（适用于本地/非云环境）
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          set +e  # 禁用 -e，让 --check 的非零退出码能被捕获
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 36); do
            NOW=$(date -u '+%H:%M UTC')
            echo "=== 轮询 #$i/36 ($NOW) ==="

            # 轻量检查：1 次 API 调用，比较最新期号
            python scripts/fetch_data.py --check
            CHECK_CODE=$?

            if [ $CHECK_CODE -eq 2 ]; then
              echo ">>> 检测到新数据，全量拉取 500 期..."
              if python scripts/fetch_data.py; then
                git add data/draws.json
                if git diff --cached --quiet; then
                  echo ">>> 文件内容未变，继续等待"
                else
                  git commit -m "chore(data): update 排列5 draws (auto) $(date -u +%Y-%m-%d_%H:%M)"
                  git push
                  echo ">>> 更新完成！"
                  exit 0
                fi
              else
                echo ">>> 全量拉取失败，继续等待"
              fi
            elif [ $CHECK_CODE -eq 0 ]; then
              echo ">>> 暂无新数据"
            else
              echo ">>> 检查异常 (code=$CHECK_CODE)，跳过本轮"
            fi

            if [ $i -lt 36 ]; then
              sleep 60
            fi
          done

          echo "=== 21:25-22:00 窗口结束，未检测到新数据 ==="
